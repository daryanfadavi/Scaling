apiVersion: v1
kind: Pod
metadata:
  name: locust
spec:
  restartPolicy: Never
  containers:
  - name: locust
    image: locustio/locust:2.47.0
    args: ["-f", "/mnt/locust/ramp.py", "--headless", "--host", "http://scale-app"]
    volumeMounts:
    - name: locustfile
      mountPath: /mnt/locust
  volumes:
  - name: locustfile
    configMap:
      name: locustfile
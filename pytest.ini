[pytest]
testpaths = tests
pythonpath = .
# tests/todo is the spec for the Camp QMIND stubs; it fails until the team
# implements them, so it's excluded by default. Run it with:  pytest -m todo
addopts = -m "not todo"
markers =
    todo: spec for code the team implements at Camp QMIND (run with: pytest -m todo)
